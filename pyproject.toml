[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "gpu-link"
version = "1.1.0"
description = "Authenticated LAN CUDA worker and Windows desktop controller"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.8,<7", "numpy>=2,<3", "nvidia-ml-py>=12", "cryptography>=44", "psutil>=6"]

[project.scripts]
gpu-link = "gpu_link.app.main:main"

[tool.setuptools.packages.find]
include = ["gpu_link*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["gpu: requires actual CUDA hardware"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
